name: Cleanup chat sessions

# Sweeps expired (>24h) session rows from the chat embeddings table.
# Calls POST /api/chat/cleanup with x-cron-secret. The endpoint deletes
# session-scoped rows past their TTL; global ROQ CX content is never touched.
#
# Required setup:
#   - GitHub repo secret: CRON_SECRET (must match the CRON_SECRET set in
#     AWS Amplify environment variables)
#   - GitHub repo variable (or hardcoded below): SITE_URL (defaults to prod)

on:
  schedule:
    # Daily at 03:17 UTC — off-peak, deliberately not on the hour to avoid
    # contention with other scheduled jobs.
    - cron: "17 3 * * *"
  workflow_dispatch: {} # Manual run via GitHub UI

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/chat/cleanup
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://www.roqcx.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set"
            exit 1
          fi
          echo "Calling $SITE_URL/api/chat/cleanup"
          HTTP_CODE=$(curl -sS -o /tmp/body -w "%{http_code}" \
            -X POST "$SITE_URL/api/chat/cleanup" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            -d '{}')
          echo "Status: $HTTP_CODE"
          echo "Body:"
          cat /tmp/body
          echo ""
          if [ "$HTTP_CODE" -ne 200 ]; then
            exit 1
          fi
